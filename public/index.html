<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="../src/css/style.css">
    
    <title>Counter</title>
</head>
<body>
    
    <div id="counter">

        <div id="acionar">

        </div>

    </div>

    <script src="../src/js/script.js"></script>
